<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 350" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#311042"/>
    </linearGradient>
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; font-size: 48px; fill: url(#text-grad); }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 500; font-size: 20px; fill: #cbd5e1; }
      .badge-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 600; font-size: 14px; fill: #38bdf8; }
      
      @keyframes float {
        0% { transform: translateY(0px); }
        50% { transform: translateY(-10px); }
        100% { transform: translateY(0px); }
      }
      @keyframes pulse {
        0% { opacity: 0.3; }
        50% { opacity: 0.8; }
        100% { opacity: 0.3; }
      }
      @keyframes chart-grow {
        0% { stroke-dashoffset: 1000; }
        100% { stroke-dashoffset: 0; }
      }
      
      .floating-card { animation: float 6s ease-in-out infinite; }
      .pulsing-grid { animation: pulse 4s ease-in-out infinite; }
      .chart-line { stroke-dasharray: 1000; stroke-dashoffset: 1000; animation: chart-grow 3s ease-out forwards; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="350" fill="url(#bg-grad)" rx="16"/>

  <!-- Dynamic Animated Graph & Nodes Background elements -->
  <g class="pulsing-grid" opacity="0.15">
    <path d="M 0,50 L 1200,50 M 0,100 L 1200,100 M 0,150 L 1200,150 M 0,200 L 1200,200 M 0,250 L 1200,250 M 0,300 L 1200,300" stroke="#64748b" stroke-width="1"/>
    <path d="M 100,0 L 100,350 M 300,0 L 300,350 M 500,0 L 500,350 M 700,0 L 700,350 M 900,0 L 900,350 M 1100,0 L 1100,350" stroke="#64748b" stroke-width="1"/>
  </g>

  <!-- Decorative Animated Wave Chart Behind Content -->
  <path opacity="0.25" stroke="url(#text-grad)" stroke-width="4" fill="none" class="chart-line" d="M 50,280 Q 200,180 400,250 T 800,160 T 1150,220" />
  <path opacity="0.15" stroke="#38bdf8" stroke-width="2" fill="none" class="chart-line" d="M 50,300 Q 250,220 500,270 T 900,190 T 1150,260" />

  <!-- Animated Floating Financial Metrics Cards (Background dynamic accents) -->
  <g class="floating-card" opacity="0.4">
    <rect x="920" y="40" width="220" height="80" rx="12" fill="url(#card-grad)" stroke="#818cf8" stroke-width="1"/>
    <circle cx="950" cy="80" r="16" fill="#818cf8" opacity="0.2"/>
    <text x="980" y="70" font-family="sans-serif" font-size="12" fill="#94a3b8">Month-End Close</text>
    <text x="980" y="92" font-family="sans-serif" font-size="18" font-weight="bold" fill="#4ade80">Automated 99.4%</text>
  </g>

  <g class="floating-card" opacity="0.3" style="animation-delay: -3s;">
    <rect x="850" y="210" width="240" height="85" rx="12" fill="url(#card-grad)" stroke="#38bdf8" stroke-width="1"/>
    <text x="880" y="245" font-family="sans-serif" font-size="12" fill="#94a3b8">Reconciliation Engine</text>
    <text x="880" y="270" font-family="sans-serif" font-size="18" font-weight="bold" fill="#38bdf8">10M+ Txns / sec</text>
  </g>

  <!-- Foreground Content (Guaranteed crisp visibility) -->
  <g transform="translate(60, 0)">
    <!-- Category Badge -->
    <rect x="0" y="55" width="280" height="32" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="140" y="76" class="badge-text" text-anchor="middle">⚡ CURATED ECOSYSTEM DIRECTORY</text>

    <!-- Main Title -->
    <text x="0" y="145" class="title">Awesome Financial Close Management 📊</text>

    <!-- Subtitle -->
    <text x="0" y="195" class="subtitle">Curated Financial Close, Account Reconciliation, Month-End &amp; FP&amp;A Platforms</text>
    <text x="0" y="225" class="subtitle" font-size="16" fill="#94a3b8">SaaS Enterprise Solutions • Open-Source Ledger Engines • Continuous Reconciliation</text>

    <!-- Bottom Feature Tags -->
    <g transform="translate(0, 260)">
      <rect x="0" y="0" width="160" height="30" rx="6" fill="#0f172a" stroke="#475569" stroke-width="1"/>
      <text x="80" y="19" font-family="sans-serif" font-size="12" fill="#cbd5e1" text-anchor="middle">📑 Account Reconciliation</text>

      <rect x="175" y="0" width="160" height="30" rx="6" fill="#0f172a" stroke="#475569" stroke-width="1"/>
      <text x="255" y="19" font-family="sans-serif" font-size="12" fill="#cbd5e1" text-anchor="middle">⏳ Month-End Close</text>

      <rect x="350" y="0" width="160" height="30" rx="6" fill="#0f172a" stroke="#475569" stroke-width="1"/>
      <text x="430" y="19" font-family="sans-serif" font-size="12" fill="#cbd5e1" text-anchor="middle">🔒 Audit-Ready SOX</text>

      <rect x="525" y="0" width="160" height="30" rx="6" fill="#0f172a" stroke="#475569" stroke-width="1"/>
      <text x="605" y="19" font-family="sans-serif" font-size="12" fill="#cbd5e1" text-anchor="middle">🤖 AI Flux Analysis</text>
    </g>
  </g>
</svg>
